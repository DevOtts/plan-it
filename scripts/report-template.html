<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{META_STAMPS}}
<title>{{TITLE}}</title>
{{FONT_LINK}}
<style>
{{BRAND_CSS}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 var(--font-body);padding:2.5rem 1rem}
main{max-width:900px;margin:0 auto;position:relative}
h1{font-family:var(--font-display);font-size:1.5rem;margin:0 0 .25rem;text-wrap:balance;padding-right:6rem}
.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;margin:0 0 .3rem}
.sub{color:var(--muted);margin:0 0 2rem}
h2{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
   margin:2.2rem 0 .8rem;border-bottom:1px solid var(--line);padding-bottom:.4rem}
#theme-toggle{position:absolute;top:0;right:0;background:var(--card);border:1px solid var(--line);
  color:var(--muted);border-radius:99px;padding:.3rem .8rem;font:inherit;font-size:.8rem;
  cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
#theme-toggle:hover{color:var(--ink)} #theme-toggle:focus-visible{outline:2px solid var(--accentBg);outline-offset:2px}
.brand-badge{color:var(--muted);font-size:.75rem;margin:0 0 .6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:1rem 1.1rem;margin-bottom:.75rem}
.card h3{margin:0 0 .35rem;font-size:1rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.id{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--accentBg) 20%,transparent);border-radius:4px;padding:.05rem .4rem}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.03em;border-radius:99px;
       padding:.1rem .55rem;text-transform:uppercase}
.b-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.b-open{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.b-hold{background:color-mix(in srgb,var(--hold) 20%,transparent);color:var(--ink)}
.b-act{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink)}
.rename{margin-left:auto;font-size:.75rem;color:var(--muted)}
.rename code{font-size:.95em}
.card p{margin:.25rem 0}
.card ul{margin:.3rem 0 .3rem;padding-left:1.25rem} .card li{margin:.18rem 0}
code{background:var(--chip);border-radius:4px;padding:.05rem .35rem;font-size:.85em;word-break:break-all;font-family:var(--font-mono)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
      border-radius:10px;overflow:hidden;font-size:.9rem}
th,td{text-align:left;padding:.5rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600} tr:last-child td{border-bottom:none}
tr.footer td{font-weight:700}
.overflow{overflow-x:auto}
.test{margin-top:.6rem;border-top:1px dashed var(--line);padding-top:.55rem;font-size:.88rem}
.test b{color:var(--ink);text-transform:uppercase;font-size:.75rem;letter-spacing:.04em}
.test ul{margin:.3rem 0 0;padding-left:1.25rem}
.warn{color:var(--warn)} .crit{color:var(--bad);font-weight:600}
details.more{margin-top:.7rem;border-top:1px dashed var(--line);padding-top:.55rem}
details.more>summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:.88rem;
  list-style:none;display:inline-flex;align-items:center;gap:.4rem}
details.more>summary::before{content:"▸";transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.srcnote{font-size:.78rem;color:var(--muted);margin:.6rem 0 .3rem}
.mdout{background:color-mix(in srgb,var(--chip) 55%,transparent);border:1px solid var(--line);
       border-radius:8px;padding:.9rem 1rem;font-size:.87rem;overflow-x:auto}
.mdout h1,.mdout h2,.mdout h3{all:revert;font-size:1.02em;margin:.8em 0 .3em;border:none;
  text-transform:none;letter-spacing:0;color:var(--ink)}
.mdout h1{font-size:1.12em}
.mdout pre{background:var(--chip);padding:.6rem .7rem;border-radius:6px;overflow-x:auto}
.mdout blockquote{border-left:3px solid var(--line);margin:.5em 0;padding:.1em .8em;color:var(--muted)}
.mdout ul,.mdout ol{padding-left:1.3em} .mdout li{margin:.15em 0}
.mdout hr{border:none;border-top:1px solid var(--line);margin:.8em 0}
.mdout a{color:var(--ink);text-decoration:underline}
.mdout table{font-size:.85em;margin:.5em 0}
.mdout td,.mdout th{padding:.35rem .6rem}
details.glossary{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:.7rem 1rem;margin-bottom:1.2rem;font-size:.88rem}
details.glossary>summary{cursor:pointer;font-weight:700;color:var(--ink)}
abbr.gl{text-decoration:underline dotted;cursor:help}
.gl-x{color:var(--muted);font-size:.82em}
.decision-card .q{margin:.3rem 0}
.decision-card .options{margin:.3rem 0;padding-left:1.25rem}
.decision-card .recommendation{margin:.4rem 0}
.decision-card .unblocks{margin:.3rem 0;font-size:.85rem;color:var(--muted)}
.decision-card .ruling{margin:.4rem 0;font-weight:600}
.mock-win{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:.75rem}
.mock-bar{background:var(--chip);padding:.4rem .7rem;display:flex;align-items:center;gap:.6rem;font-size:.8rem}
.mock-dots{color:var(--muted)} .mock-label{color:var(--muted);flex:1}
.mock-chip{border-radius:99px;padding:.1rem .5rem;font-size:.72rem;font-weight:600}
.mock-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.mock-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mock-body{padding:1rem;background:var(--bg)}
.measure{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.75rem}
.measure .mvalue{font-family:var(--font-display);font-weight:700;font-size:1.4rem}
.measure .munit{color:var(--muted);margin-left:.3rem}
.measure .msrc{color:var(--muted);font-size:.8rem;margin:.3rem 0 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:.75rem}
.state-col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem}
.state-col h4{margin:0 0 .3rem;text-transform:uppercase;font-size:.75rem;letter-spacing:.04em}
.triage-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.75rem}
.triage-card table{border:none}
.verdict-box{margin-top:.5rem;padding:.5rem .8rem;background:var(--chip);border-radius:8px}
.lockbox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accentBg);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.75rem}
.lb-head{color:var(--muted);font-size:.85rem;margin:0 0 .4rem}
.tally-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.tally-tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;text-align:center}
.tally-tile .tval{display:block;font-family:var(--font-display);font-weight:700;font-size:1.4rem}
.tally-tile .tlabel{color:var(--muted);font-size:.78rem}
pre.copy{background:var(--chip);border-radius:8px;padding:.7rem .9rem;font-family:var(--font-mono);font-size:.85rem;overflow-x:auto}
.copy-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:.25rem .7rem;font-size:.78rem;cursor:pointer;margin:-.5rem 0 .75rem}
pre.mermaid{background:var(--chip);border-radius:8px;padding:.8rem 1rem;font-family:var(--font-mono);font-size:.82rem;overflow-x:auto;white-space:pre-wrap}
.footer{color:var(--muted);font-size:.75rem;margin-top:2.5rem;border-top:1px solid var(--line);padding-top:.8rem}
@media (prefers-reduced-motion: reduce){ details.more>summary::before{transition:none} }
</style>
</head>
<body><main>
<button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">◐ <span id="theme-label">auto</span></button>
{{BRAND_BADGE}}
<p class="eyebrow">{{EYEBROW}}</p>
<h1>{{TITLE}}</h1>
<p class="sub">{{SUBTITLE}}</p>
{{GLOSSARY}}
{{BODY}}
{{FOOTER}}
<script>
// Theme toggle: auto → light → dark → auto. Persists per-viewer (try/catch — storage may be blocked).
(function(){
  const btn=document.getElementById("theme-toggle"), lab=document.getElementById("theme-label");
  const order=["auto","light","dark"]; let cur="auto";
  try{ cur=localStorage.getItem("report-theme")||"auto" }catch(e){}
  function apply(v){
    cur=v; lab.textContent=v;
    if(v==="auto"){ document.documentElement.removeAttribute("data-theme"); }
    else{ document.documentElement.setAttribute("data-theme",v); }
    try{ localStorage.setItem("report-theme",v) }catch(e){}
  }
  apply(cur);
  btn.addEventListener("click",()=>apply(order[(order.indexOf(cur)+1)%order.length]));
})();
// Copy-to-clipboard: client-side navigator.clipboard, try/catch — API may be unavailable.
document.querySelectorAll(".copy-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    var pre = btn.previousElementSibling;
    var text = pre ? pre.textContent : "";
    try{
      navigator.clipboard.writeText(text);
    }catch(e){
      var note = document.createElement("p");
      note.className = "warn"; note.textContent = "select the text above";
      btn.parentNode.insertBefore(note, btn.nextSibling);
    }
  });
});
</script>
<script>
/* MDPARSER-START */
{{CLIENT_MD_JS}}
/* MDPARSER-END */
document.querySelectorAll('script[type="text/markdown"]').forEach(function(s){
  var d=document.createElement("div"); d.innerHTML=md(s.textContent.trim());
  s.parentNode.replaceChild(d,s);
});
</script>
{{MERMAID_SCRIPT}}
</main></body>
</html>
